name: ci

# Lint, unit + integration tests against Postgres (pgvector 0.8.7) and Redis,
# with cached fastembed model and offline embeddings. deploy.yml runs after a green push.
on:
  push: { branches: [main] }
  pull_request: {}

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:0.8.7-pg16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: dev
          POSTGRES_DB: triagelens_test
        ports: ["5434:5432"]
        options: --health-cmd "pg_isready -U postgres -d triagelens_test" --health-interval 5s --health-retries 10
      redis:
        image: redis:8-alpine
        ports: ["6381:6379"]
        options: --health-cmd "redis-cli ping" --health-interval 5s --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql+asyncpg://postgres:dev@localhost:5434/triagelens_test
      TEST_REDIS_URL: redis://localhost:6381/1
      DATABASE_URL: postgresql+asyncpg://postgres:dev@localhost:5434/triagelens_test
      REDIS_URL: redis://localhost:6381/0
      RATE_LIMIT_ENABLED: "false"
      MODEL_DIR: /home/runner/.cache/triagelens/models
      FASTEMBED_CACHE_PATH: /home/runner/.cache/triagelens/models
      HF_HUB_OFFLINE: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version-file: ".python-version"
          enable-cache: true
      - run: uv sync --locked

      - name: Extract fastembed version
        id: fastembed-version
        run: |
          version=$(grep -A1 'name = "fastembed"' uv.lock | grep 'version =' | cut -d '"' -f2)
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Cache embedding model
        id: cache-model
        uses: actions/cache@v4
        with:
          path: /home/runner/.cache/triagelens/models
          key: bge-small-en-v1.5-${{ steps.fastembed-version.outputs.version }}

      - name: Download model on cache miss
        if: steps.cache-model.outputs.cache-hit != 'true'
        env:
          HF_HUB_OFFLINE: "0"
        run: |
          uv run python -c "from fastembed import TextEmbedding; TextEmbedding('BAAI/bge-small-en-v1.5', cache_dir='${MODEL_DIR}')"

      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run pytest tests/unit tests/integration

  build-image:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build Dockerfile
        run: docker build .
